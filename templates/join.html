<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Game</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="/static/favicon.svg"
    >

</head>

<body>

<main class="container">

    <div class="card">

        <h1>🎮 Join Game</h1>

        <div class="game-code">
            {{ game["id"] }}
        </div>

        <p>
            Enter your name to join this game.
        </p>

        <form
            action="/join/{{ game['id'] }}"
            method="post"
        >

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="name"
                required
            >

            <button
                type="submit"
                class="button"
            >
                🎮 Join Game
            </button>

        </form>

    </div>

</main>

</body>

</html>
